name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627665855519:role/github-actions-codeartifact-publish
          aws-region: eu-north-1

      - name: Configure registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          URL=$(aws codeartifact get-repository-endpoint \
            --domain my-domain \
            --domain-owner "$ACCOUNT_ID" \
            --repository rust-packages \
            --format cargo \
            --query repositoryEndpoint \
            --output text)
          mkdir -p .cargo
          printf '[registries.rust-packages]\nindex = "sparse+%s"\ncredential-provider = "cargo:token-from-stdout aws codeartifact get-authorization-token --domain my-domain --domain-owner %s --region eu-north-1 --query authorizationToken --output text"\n' "$URL" "$ACCOUNT_ID" > .cargo/config.toml
          cat .cargo/config.toml

      - name: Publish to CodeArtifact
        run: cargo publish --registry rust-packages --allow-dirty
