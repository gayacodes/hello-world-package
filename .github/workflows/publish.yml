name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Get CodeArtifact token and configure registry
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain my-domain \
            --query authorizationToken \
            --output text)
          URL=$(aws codeartifact get-repository-endpoint \
            --domain my-domain \
            --repository rust-packages \
            --format cargo \
            --query repositoryEndpoint \
            --output text)
          mkdir -p .cargo
          printf '[registries.rust-packages]\nindex = "sparse+%s"\ncredential-provider = "cargo:token"\n' "$URL" > .cargo/config.toml
          echo "Bearer ${TOKEN}" | cargo login --registry rust-packages
          cat .cargo/config.toml

      - name: Publish to CodeArtifact
        run: cargo publish --registry rust-packages
