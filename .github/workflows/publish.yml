name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Get CodeArtifact token
        id: codeartifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain my-domain \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Get registry URL
        id: registry
        run: |
          URL=$(aws codeartifact get-repository-endpoint \
            --domain my-domain \
            --repository rust-packages \
            --format cargo \
            --query repositoryEndpoint \
            --output text)
          echo "url=sparse+${URL}" >> "$GITHUB_OUTPUT"

      - name: Configure registry
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [registries.rust-packages]
          index = "${{ steps.registry.outputs.url }}"
          credential-provider = "cargo:token"
          EOF

      - name: Publish to CodeArtifact
        env:
          CARGO_REGISTRIES_RUST_PACKAGES_TOKEN: "Bearer ${{ steps.codeartifact.outputs.token }}"
        run: cargo publish --registry rust-packages
